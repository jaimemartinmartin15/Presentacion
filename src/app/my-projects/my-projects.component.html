<h1>Mis proyectos</h1>

<ul>
  @for (project of myProjects; track $index) {
    <li>
      <jei-box-card class="card">
        <a [href]="project.href">
          <img [src]="project.thumbnail" alt="" />

          <span class="title">{{ project.title }}</span>
        </a>
      </jei-box-card>
    </li>
  }
</ul>
