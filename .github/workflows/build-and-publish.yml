name: Build And Deploy
run-name: Deploy Presentacion to AWS S3

on:
  workflow_dispatch: # allow manual trigger
  push:
    tags: ["[1-9].[0-9][0-9]?.[0-9][0-9]?"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: "@jaimemartinmartin15"
      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_TOKEN }}
      - name: Generate icons
        run: |
          mkdir -p src/app/svg-icons
          npm run icons
      - name: Build
        run: npm run build
      - name: AWS checks
        run: npm run aws-checks
      - name: Set AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          mask-aws-account-id: true
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-2
      - name: Deploy
        run: |
          aws --version
          aws s3 sync ./dist/presentacion/browser \
                      s3://jaimeelingeniero.es \
                      --delete \
                      --exclude sitemap.xml \
                      --exclude robots.txt \
                      --exclude jaimeelingenieroesca.crt \
                      --exclude 'comprende-rxjs/*' \
                      --exclude 'bases-de-datos/*' \
                      --exclude 'redes/*' \
                      --exclude 'comandos/*' \
                      --exclude 'ingles/*' \
                      --exclude 'lista-de-viaje/*' \
                      --exclude 'creador-iconos-svg/*' \
                      --exclude 'codigo-qr/*' \
                      --exclude 'comparar-ficheros/*' \
                      --exclude 'horario-de-trabajo/*' \
                      --exclude 'idiotizador/*' \
                      --exclude 'como-resolver-el-cubo-de-rubik/*'
          aws s3 cp ./dist/presentacion/3rdpartylicenses.txt s3://jaimeelingeniero.es/3rdpartylicenses.txt
